<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Hoàng Thái Dương</title><link rel="stylesheet" href="css/styles.css"></head><body>
<header class="site-header"><div class="wrap nav"><a class="brand" href="index.html">HTD</a><div class="nav-actions"><span class="meta" style="margin:0">Admin workspace</span></div></div></header>
<main class="wrap content">
<section id="loginView" class="panel" style="max-width:520px;margin:60px auto"><h1>Admin Login</h1><p class="meta">GitHub Pages edition: data is stored only in this browser.</p><form id="loginForm" class="form-grid"><div class="field full"><label>Username</label><input id="username" class="input" required autocomplete="username"></div><div class="field full"><label>Password</label><input id="password" class="input" type="password" required></div><div class="field full"><button class="primary" type="submit">Login</button><div id="loginError" class="error"></div></div></form></section>
<section id="adminView" class="hidden"><div class="admin-shell"><aside class="admin-side"><div class="side-brand"><div class="brand admin-brand">HTD</div><div><strong>Admin Studio</strong><span>Personal CMS</span></div></div><div class="side-title">WORKSPACE</div><button class="side-btn active" data-page="dashboard"><span class="side-icon">⌂</span><span>Dashboard</span></button><button class="side-btn" data-page="profile"><span class="side-icon">◉</span><span>Profile</span></button><button class="side-btn" data-page="posts"><span class="side-icon">✎</span><span>Posts</span></button><button class="side-btn" data-page="projects"><span class="side-icon">▣</span><span>Projects</span></button><button class="side-btn" data-page="media"><span class="side-icon">▧</span><span>Media</span></button><div class="side-title side-title-bottom">SYSTEM</div><button class="side-btn" data-page="backup"><span class="side-icon">↥</span><span>Backup & Restore</span></button><a class="side-site-link" href="index.html"><span>↗</span> View public profile</a></aside><div class="admin-main"><div class="admin-topbar"><div><div class="eyebrow">CONTROL CENTER</div><h1 id="adminTitle">Dashboard</h1><p class="meta">Manage your personal profile, content and media from one place.</p></div><div class="admin-top-actions"><a class="ghost" href="index.html">Preview site</a><button id="logoutBtn" class="ghost hidden">Logout</button></div></div><div id="adminContent"></div></div></div></section>
</main><div id="toast" class="toast"></div>
<script src="js/data.js"></script><script src="js/admin.js"></script>
</body></html>
