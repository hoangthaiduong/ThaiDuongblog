<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Post — Hoàng Thái Dương</title><link rel="stylesheet" href="css/styles.css"></head><body>
<header class="site-header"><div class="wrap nav"><a class="brand" href="index.html">HTD</a><nav><a href="index.html#posts">Posts</a><a href="index.html#projects">Projects</a><a href="index.html#about">About</a></nav><div class="nav-actions"><a class="ghost" href="admin.html">Admin</a></div></div></header>
<main class="wrap content"><article id="post" class="panel" style="max-width:900px;margin:40px auto"></article></main>
<script src="js/data.js"></script><script>const q=new URLSearchParams(location.search).get('slug');const s=TDStore.load();const p=s.posts.find(x=>x.slug===q&&x.status==='published');const el=document.querySelector('#post');if(!p){el.innerHTML='<h1>Post not found</h1><p class="meta">This post may be unpublished or no longer exists.</p>'}else{document.title=p.title+' — Hoàng Thái Dương';el.innerHTML=(p.cover_url?'<img class="hero-img" src="'+p.cover_url+'" alt="">':'')+'<div class="meta">'+(p.category||'Post')+' · '+new Date(p.created_at).toLocaleDateString()+'</div><h1 style="margin:.35em 0">'+String(p.title).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</h1><div class="article-content">'+String(p.content).replace(/\n/g,'<br><br>')+'</div><p style="margin-top:28px"><a class="ghost" href="index.html#posts">← Back to posts</a></p>'}</script></body></html>
